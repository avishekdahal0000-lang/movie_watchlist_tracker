<html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>CINETRACK</title>
      <link rel="stylesheet" href="login.css" />
    </head>
    <body>
      <div class="container">
        <div class="form-box">
          <h1>🎬 CINETRACK</h1> <br>
          <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="name" name="name" placeholder="Username" required /><br>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="At least 8 unique characters" required minlength="8" /><br>
            <button type="submit" class="submit-btn">Login</button>
          </form>
          <script>
            document
              .getElementById("loginForm")
              .addEventListener("submit", function (e) {
                e.preventDefault();
                window.location.href = "dashboard.html";
              });
          </script>
          <div class="row">
            <label class="checkbox"
              ><input type="checkbox" /> Remember me</label><br>
            <a href="#">Forgot password?</a>
          </div>
          <div class="switch">
            Don't have an account? <br />
            <a href="signup.html">Create one</a>
    
          </div>
          </div>
        </div>
      </div>
    </body>
  </html>
</html>
